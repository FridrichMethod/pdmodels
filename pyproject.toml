[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdmodels"
authors = [{ name = "Zhaoyang Li", email = "zhaoyangli@stanford.edu" }]
license = { file = "LICENSE" }
dynamic = ["version"]
description = "Protein Design Models CLI and library"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "biopython",
    "biotite",
    "ipympl",
    "jupyter",
    "matplotlib",
    "mdanalysis",
    "mdtraj",
    "modelcif",
    "numpy",
    "pandas",
    "polars",
    "prody",
    "py3Dmol",
    "pyarrow",
    "rdkit",
    "scikit-learn",
    "scipy",
    "seaborn",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-html",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
]
mypy = [
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
    "types-aiofiles",
    "types-cachetools",
    "types-click",
    "types-python-dateutil",
    "types-python-slugify",
    "types-pytz",
    "types-redis",
    "types-requests",
    "types-seaborn",
    "types-setuptools",
    "types-six",
    "types-tabulate",
    "types-toml",
    "types-tqdm",
]

[project.scripts]
pdmodels = "pdmodels.cli:main"

[tool.ruff]
target-version = "py312"
preview = false
src = ["src"]
line-length = 100
force-exclude = true
extend-exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
# Check https://beta.ruff.rs/docs/rules/ for full list of rules
select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "E",    # pycodestyle
  "F",    # Pyflakes
  "I",    # isort
  "NPY",  # numpy
  "PD",   # pandas-vet
  "PERF", # perflint
  "PLE",  # pylint-error
  "RUF",  # ruff
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
]
extend-select = [
  "D",   # pydocstyle
  "W",   # pycodestyle
  "PLW", # pylint-warning
]
ignore = ["B905", "E203", "E501", "E741", "UP037"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["pdmodels"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.ipynb" = ["F401", "RUF059"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
pretty = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = false
namespace_packages = false
enable_incomplete_feature = ["Unpack"]
disable_error_code = ["import-not-found", "import-untyped", "no-any-return"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pdmodels.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v -s --tb=short --strict-markers --color=yes"
testpaths = ["tests"]
env = ["TQDM_DISABLE=1"]
